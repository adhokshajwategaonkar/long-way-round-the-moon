<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Long Way Round the Moon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500&family=Geist+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<!-- one face per place; each on its own line so that one bad request cannot take the others down -->
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@200;300;400;600&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,300..800&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;1,400;1,500&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Abril+Fatface&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Courier+Prime&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Monoton&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Special+Elite&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Syncopate:wght@700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Marcellus&display=swap" rel="stylesheet">
<style>
:root{
  /* layout: full-bleed 3D canvas. Song top-left, volume top-right, the journey as one scale along the bottom.
     Titles and story are not on this layer at all: they stand in the landscape, to one side of the path, and are drawn in the canvas. */
  --ground:#0B0B0C;
  --ink:#EDECE8;
  --mut:#A5A39C;
  --hot:#FF6B3D;
  --hud:#EDECE8;
  --scrim:rgba(6,7,10,.62);
  --f-sans:'Geist',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  --f-ui:'Archivo','Geist',ui-sans-serif,system-ui,sans-serif;
  --f-serif:'Instrument Serif','Iowan Old Style','Palatino Linotype',Georgia,serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--ground);color:var(--ink);font-family:var(--f-sans);overflow:hidden;-webkit-font-smoothing:antialiased;overscroll-behavior:none}
canvas#gl{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab;outline:none}
canvas#gl.drag{cursor:grabbing}
canvas#gl{opacity:0;transition:opacity 1.8s ease}
canvas#gl.on{opacity:1}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
:focus-visible{outline:2px solid var(--hot);outline-offset:4px}
.lab{font:500 10.5px/1.5 var(--f-mono);letter-spacing:.2em;text-transform:uppercase;margin:0;text-shadow:0 1px 12px rgba(0,0,0,.25)}
#grain{position:fixed;inset:-90px;pointer-events:none;z-index:1;opacity:.62;mix-blend-mode:overlay;animation:grain .9s steps(5) infinite;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3'/><feColorMatrix type='saturate' values='0'/></filter><rect width='180' height='180' filter='url(%23n)' opacity='.5'/></svg>")}
@keyframes grain{0%{transform:translate(0,0)}20%{transform:translate(-37px,22px)}40%{transform:translate(28px,-41px)}60%{transform:translate(-19px,-17px)}80%{transform:translate(44px,31px)}100%{transform:translate(0,0)}}
@media (prefers-reduced-motion:reduce){#grain{animation:none}}
#vig{position:fixed;inset:0;pointer-events:none;z-index:1;background:radial-gradient(ellipse 80% 78% at 50% 46%,transparent 55%,rgba(0,0,0,.4) 100%)}

/* ---------- gate: no panel. The walk's first place is the page: the eclipse over the water, the title on the water
   below it, lettered like the titles in the land, and the ten places already laid out along the bottom. ---------- */
#gate{position:fixed;inset:0;z-index:6;transition:opacity 1.3s ease,visibility 1.3s;pointer-events:none;
  background:linear-gradient(to bottom,rgba(2,3,8,0) 45%,rgba(2,3,8,.42) 100%)}
#gate.gone{opacity:0;visibility:hidden}
#gate #g-scale{opacity:0;transition:opacity 1.2s ease}
#gate.in #g-scale{opacity:1}
#gate button{pointer-events:auto}
#g-mid{position:absolute;left:50%;top:51%;transform:translateX(-50%);width:min(64rem,calc(100vw - 40px));display:grid;justify-items:center;gap:16px;text-align:center}
#g-mid::before{content:"";position:absolute;inset:-30px -10% -40px;background:radial-gradient(closest-side,rgba(2,3,8,.55),transparent);z-index:-1}
#gate h1{font:200 clamp(30px,4.3vw,74px)/1.08 'Jost',var(--f-sans);letter-spacing:.1em;padding-left:.1em;margin:0;text-wrap:balance;color:#e8ecf6}
#gate h1,#gate #beat,#gate #begin{animation:rise 1.6s cubic-bezier(.2,.8,.2,1) both}
#gate #beat{animation-delay:.15s}#gate #begin{animation-delay:.35s}
@keyframes rise{from{opacity:0;transform:translateY(14px);filter:blur(6px)}}
#beat{width:min(520px,72vw);height:40px;overflow:visible;margin-top:-6px}
#beat path{fill:none;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke}
#beat .base{stroke:#e8ecf6;stroke-width:1;opacity:.35}
#beat .trace{stroke:#ffd9b4;stroke-width:1.6;stroke-dasharray:14 100;stroke-dashoffset:114;animation:trace 1.087s linear infinite;filter:drop-shadow(0 0 4px rgba(255,190,140,.9))}
@keyframes trace{to{stroke-dashoffset:0}}
#begin{display:flex;align-items:center;gap:14px;padding:10px 8px;margin-top:6px;color:#e8ecf6;transition:opacity .6s}
#begin[disabled]{opacity:.4;cursor:wait}
#begin .ecl{width:26px;height:26px;border-radius:50%;background:#040408;transform:scale(calc(1 + var(--pu,0) * .12));
  box-shadow:0 0 0 1px rgba(255,226,196,.75),0 0 calc(8px + var(--pu,0) * 26px) calc(1px + var(--pu,0) * 4px) rgba(255,185,130,.55)}
#begin .lab{position:relative;padding-bottom:5px;font-size:11px;letter-spacing:.26em}
#begin .lab::after{content:"";position:absolute;left:0;right:.16em;bottom:0;height:1px;background:currentColor;transform:scaleX(.35);transform-origin:left;transition:transform .5s cubic-bezier(.2,.8,.2,1)}
#begin:hover .lab::after,#begin:focus-visible .lab::after{transform:none}
#status{font:500 10.5px/1.5 var(--f-mono);letter-spacing:.2em;text-transform:uppercase;color:var(--mut);margin:0;min-height:1.5em}
#status.bad{color:#ff9c8a}
#g-scale{color:var(--ink)}
#g-scale .seg{pointer-events:auto}
#file{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
@media (max-height:860px){ #g-mid{top:48%;gap:12px} #begin{margin-top:0} }
@media (max-width:720px){ #g-mid{top:50%} #gate h1{letter-spacing:.07em} }
@media (prefers-reduced-motion:reduce){ #beat .trace{animation:none;stroke-dasharray:none;opacity:.6} }

/* ---------- hud ---------- */
#hud{position:fixed;inset:0;pointer-events:none;color:var(--hud);opacity:0;transition:opacity 1.4s ease .4s;z-index:3}
#hud.on{opacity:1}
/* the song: what is playing and how far into it you are */
#song{position:absolute;left:18px;top:14px;width:min(250px,54vw);display:grid;gap:5px;pointer-events:auto}
#song .lab{opacity:.7}
#song-t{font:500 20px/1.15 var(--f-ui);letter-spacing:.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#song.swap #song-t{animation:swap .9s cubic-bezier(.2,.8,.2,1)}
@keyframes swap{from{opacity:0;transform:translateY(10px);filter:blur(4px)}}
#song-bar{position:relative;height:16px;cursor:pointer;display:block;width:100%}
#song-bar::before{content:"";position:absolute;left:0;right:0;top:7.5px;height:1px;background:currentColor;opacity:.4}
#song-fill{position:absolute;left:0;top:7px;height:2px;width:0;background:var(--hot);transition:width .3s linear}
#song-fill::after{content:"";position:absolute;right:-4px;top:-3px;width:8px;height:8px;border-radius:50%;background:var(--hot)}
#song-ticks i{position:absolute;top:5px;width:1px;height:6px;background:currentColor;opacity:.6}
#song-time{font-variant-numeric:tabular-nums;font-feature-settings:'tnum';opacity:.8}
#vol{position:absolute;right:16px;top:14px;pointer-events:auto;display:flex;align-items:center;gap:10px;opacity:.8}
#vol:hover{opacity:1}
#volume{-webkit-appearance:none;appearance:none;width:110px;height:18px;background:transparent;cursor:pointer;margin:0}
#volume::-webkit-slider-runnable-track{height:1px;background:currentColor}
#volume::-moz-range-track{height:1px;background:currentColor}
#volume::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;border-radius:50%;background:currentColor;margin-top:-5.5px}
#volume::-moz-range-thumb{width:12px;height:12px;border:0;border-radius:50%;background:currentColor}
#sound{pointer-events:auto;border-bottom:1px solid currentColor;padding-bottom:3px}
#sound[hidden],#vol-l[hidden],#volume[hidden]{display:none}

/* the story: one sentence at a time, left of centre and just under the horizon, where the ground is plain.
   Close enough to the middle to read with a glance, clear of the titles and the sky. It never moves and nothing waits for it. */
#plaque{position:absolute;bottom:17%;width:min(370px,calc(100vw - 44px));color:var(--note,var(--hud));pointer-events:none;opacity:0;will-change:opacity,transform}
#plaque.l{left:clamp(22px,7vw,110px);text-align:left}
#plaque.r{right:clamp(22px,7vw,110px);text-align:right}
#plaque::before{content:"";position:absolute;inset:-56px -90px;background:radial-gradient(closest-side,var(--scrim),transparent);opacity:.42;z-index:-1}
#pl-k{font:500 11px/1.4 var(--f-mono);letter-spacing:.18em;text-transform:uppercase;color:var(--acc,var(--hot));margin:0 0 11px}
#pl-t{margin:0;font:420 16px/1.65 var(--f-ui);text-wrap:pretty;text-shadow:0 1px 14px rgba(0,0,0,.2)}
#pl-t span{transition:opacity 1.1s ease,filter 1.1s ease}
#pl-c{font:500 10px/1.4 var(--f-mono);letter-spacing:.16em;text-transform:uppercase;opacity:.5;margin:13px 0 0}
#notes-b{position:absolute;right:16px;top:44px;pointer-events:auto;opacity:.6;border-bottom:1px solid currentColor;padding-bottom:3px}
#notes-b:hover{opacity:1}
#hint{position:absolute;left:50%;bottom:104px;transform:translateX(-50%);opacity:.75;white-space:nowrap;transition:opacity 1.6s}
#hint.done{opacity:0}
#endnote{position:absolute;left:50%;top:58%;transform:translateX(-50%);display:grid;justify-items:center;gap:16px;text-align:center;width:min(32rem,calc(100vw - 40px));opacity:0;visibility:hidden;transition:opacity 1.6s,visibility 1.6s}
#endnote.on{opacity:1;visibility:visible}
#endnote p{margin:0;font:420 clamp(18px,1.7vw,22px)/1.6 var(--f-ui)}
#endnote button{pointer-events:auto;border-bottom:1px solid currentColor;padding-bottom:4px}

/* the journey: ten places on one line */
.scale{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);width:min(780px,calc(100vw - 36px));display:grid;gap:9px;justify-items:center}
.tip{font:500 clamp(15px,1.3vw,17px)/1.1 var(--f-ui);letter-spacing:.01em;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.tip small{font:500 10px/1 var(--f-mono);letter-spacing:.2em;text-transform:uppercase;opacity:.6;margin-left:1.2em}
.rail{position:relative;width:100%;height:30px;pointer-events:auto}
.rail::before{content:"";position:absolute;left:0;right:0;top:14px;height:1px;background:currentColor;opacity:.4}
.seg{position:absolute;top:0;height:30px;display:block}
.seg svg{position:absolute;left:-7px;top:7.5px;width:14px;height:14px;overflow:visible;opacity:.7;transition:transform .25s,opacity .25s}
.seg:hover svg,.seg.here svg{opacity:1;transform:scale(1.4)}
.tick{position:absolute;top:10px;width:9px;height:9px;margin-left:-4.5px;display:grid;place-items:center}
.tick::before{content:"";width:3px;height:3px;border-radius:50%;background:currentColor;opacity:.5;transition:transform .2s,opacity .2s}
.tick.st::before{width:1px;height:7px;border-radius:0}
.tick:hover::before{transform:scale(2.2);opacity:1}
#pin{position:absolute;top:8.5px;width:12px;height:12px;margin-left:-6px;border-radius:50%;border:1.5px solid currentColor;background:var(--hot);pointer-events:none;box-shadow:0 0 12px var(--hot)}

/* a far jump along the scale is crossed behind one short blink */
#veil{position:fixed;inset:0;z-index:4;pointer-events:none;background:var(--ground);opacity:0;transition:opacity .24s ease}
#veil.on{opacity:1}
#toast{position:fixed;left:50%;top:84px;transform:translateX(-50%);max-width:min(34rem,calc(100vw - 40px));padding:10px 14px;background:rgba(8,8,10,.92);border:1px solid #37373C;font:420 14px/1.55 var(--f-ui);color:var(--ink);opacity:0;transition:opacity .4s;z-index:7;pointer-events:none}
#toast.on{opacity:1}
@media (max-width:720px){
  #hint{white-space:normal;text-align:center;width:70vw;bottom:150px}
  #plaque,#plaque.l,#plaque.r{left:50%;right:auto;transform:translateX(-50%);text-align:center;bottom:150px;width:min(84vw,360px)} #pl-t{font-size:14.5px}
  #volume{width:84px}
  .tip small{display:none}
}
@media (prefers-reduced-motion:reduce){ #gate,#hud,#endnote,#veil,#plaque,#pl-t span{transition-duration:.01s} #song.swap #song-t{animation:none} }
</style>
</head>
<body>
<canvas id="gl" tabindex="0" aria-label="A walkable 3D landscape. Scroll or use the arrow keys to walk, drag to look around."></canvas>
<div id="vig"></div>
<div id="grain"></div>

<section id="gate" aria-labelledby="ttl">
  <div id="g-mid">
    <h1 id="ttl">the long way round the moon</h1>
    <svg id="beat" viewBox="0 0 520 40" preserveAspectRatio="none" aria-hidden="true">
      <path class="base" d="M0 26H300L312 20L322 26H334L342 34L354 2L366 36L376 26H400L416 19L432 26H520"/>
      <path class="trace" pathLength="100" d="M0 26H300L312 20L322 26H334L342 34L354 2L366 36L376 26H400L416 19L432 26H520"/>
    </svg>
    <button id="begin" type="button" disabled><span class="ecl"></span><span class="lab" id="begin-l">Begin the walk</span></button>
    <p id="status" role="status">Laying out the land&hellip;</p>
  </div>
  <div class="scale" id="g-scale"><div class="tip" id="g-tip"><span class="nm">Speak to Me</span><small>The far side</small></div><nav class="rail" id="g-rail" aria-label="Start from a place"></nav></div>
</section>
<input type="file" id="file" accept="audio/*,.ogg,.oga,.mp3,.m4a,.flac,.wav" tabindex="-1">

<div id="hud">
  <div id="song">
    <span class="lab" id="song-l">Now playing</span>
    <div id="song-t"></div>
    <button id="song-bar" type="button" aria-label="Position in this song. Click to move within the song."><i id="song-fill"></i><span id="song-ticks"></span></button>
    <span class="lab" id="song-time"></span>
  </div>
  <label id="vol" class="lab"><button id="sound" class="lab" type="button" hidden>Add sound</button><span id="vol-l">Volume</span><input type="range" id="volume" min="0" max="100" value="80" aria-label="Volume"></label>
  <button id="notes-b" class="lab" type="button" aria-label="Show or hide the story notes">Notes on</button>
  <div id="plaque" class="l" aria-live="polite"><p id="pl-k"></p><p id="pl-t"></p><p id="pl-c"></p></div>
  <div id="hint" class="lab">Scroll to walk, drag to look</div>
  <div id="endnote"><p>Only the heartbeat is left, as it was at the start.</p><button id="again" class="lab" type="button">Walk me back</button></div>
  <div id="scale" class="scale"><div id="tip" class="tip"></div><nav id="rail" class="rail" aria-label="Places along the walk"><span id="pin"></span></nav></div>
</div>
<div id="veil" aria-hidden="true"></div>
<div id="toast" role="status"></div>

<script>
(() => {
'use strict';
const $ = s => document.querySelector(s);
const TAU = Math.PI * 2, DEG = Math.PI / 180;
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const hex = h => [parseInt(h.slice(1, 3), 16) / 255, parseInt(h.slice(3, 5), 16) / 255, parseInt(h.slice(5, 7), 16) / 255];
const norm = v => { const l = Math.hypot(v[0], v[1], v[2]) || 1; return [v[0] / l, v[1] / l, v[2] / l]; };
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;

/* =====================================================================
   THE TEN PLACES
   moves: F = forward [dist, rise], A = arc [radius, degrees (+ right), rise], P = name this spot
   marks: [where, seconds into the album file, name]   where = 0..1 of the place, or units from its start if larger
   st:    the story: one plain sentence at a time, shown as a small caption in the corner of the screen while you
          walk the stretch it belongs to. The first comes up `at` units into the place, the rest NGAP apart.
          Nothing stops the walk: the music is cued so that the moment at `t` arrives as you pass the last one.
   ti,ts: how far into the place its title stands, and on which side; tv: from how far it shows
   a0,a1: the stretch of the album file that belongs to this place
   ===================================================================== */
const SERIF = "'Instrument Serif','Iowan Old Style',Georgia,serif";
const SANS = "'Geist','Helvetica Neue',Helvetica,Arial,sans-serif";
const MONO = "'Geist Mono',ui-monospace,Menlo,monospace";
const NGAP = 40;
const TRACKS = [0, 70, 241, 466, 874, 1153, 1538, 2005, 2213, 2440, 2545];      // where each song really starts in the file
const CH = [
 { no: 'I', ts: 'r', name: 'Speak to Me', place: 'The far side', a0: 0, a1: 78, ti: 96,
   moves: [['A', 370, 14, .3], ['A', 370, -28, .5], ['A', 370, 14, .5]],
   marks: [[0, 3, 'The heartbeat']],
   st: [ { at: 170, side: 'r', t: 32, name: 'The voices', notes: ['The album came out on 1 March 1973.', 'It stayed on the American chart for 741 weeks. That is about fourteen years.'] },
         { at: 280, side: 'r', t: 60, name: 'First light', notes: ['It has sold more than 45 million copies.', 'The first thing you hear on it is a heartbeat.'] } ] },
 { no: 'II', ts: 'l', name: 'Breathe', place: 'First morning', a0: 67, a1: 241,
   moves: [['F', 50, 3], ['A', 70, 50, 5], ['P', 'crest'], ['F', 30, 1], ['A', 60, -80, -6], ['P', 'plain'], ['F', 120, -2]],
   marks: [[0, 67.5, 'First chord']],
   st: [ { at: 150, side: 'r', t: 144.5, name: 'The voice enters', notes: ['Rick Wright played jazz before he played in this band.', 'There is a chord in this song that he took from Miles Davis.'] },
         { at: 300, side: 'l', t: 194, name: 'Second verse', notes: ['He heard it on Kind of Blue and worked it out at home.'] } ] },
 { no: 'III', ts: 'r', name: 'On the Run', place: 'The runway', a0: 241, a1: 432, tv: 72,
   moves: [['F', 30, -3], ['P', 'rw0'], ['F', 290, 0], ['P', 'rw1'], ['F', 60, 1]],
   marks: [[0, 243, 'Boarding'], [354, 411.5, 'The crash']],
   st: [ { at: 120, side: 'l', t: 286, name: 'The sequence locks in', notes: ['On stage in 1972 this was a guitar jam called The Travel Sequence.', 'In the studio they fed eight notes into a synthesiser and sped them up.'] },
         { at: 316, side: 'r', t: 404, name: 'Footsteps', notes: ['The running feet are Peter James, the assistant engineer, doing laps of the studio.'] } ] },
 { no: 'IV', ts: 'l', name: 'Time', place: 'The sundial', a0: 428, a1: 873,
   moves: [['F', 210, 0], ['P', 'dial0'], ['A', 40, 90, 2.6], ['A', 40, 90, -2.6], ['P', 'dial1'], ['F', 92, 0]],
   marks: [[0, 444, 'Ticking'], ['arc', .26, 599, 'First verse'], ['arc', 1.44, 825, 'Home again']],
   st: [ { at: 90, side: 'r', t: 466, name: 'Alarm clocks', notes: ['Alan Parsons recorded each of these clocks by itself in an antique shop.', 'He made the tape to show off a new sound system, not for the band.', 'He mentioned it during the sessions and they used it.'] } ] },
 { no: 'V', ts: 'r', name: 'The Great Gig in the Sky', place: 'The summit', a0: 874, a1: 1151, tv: 62,
   moves: [['A', 60, -60, 2], ['F', 40, 6], ['A', 70, 80, 18], ['A', 70, -90, 20], ['F', 40, 8], ['P', 'summit'], ['A', 70, 60, -16], ['F', 70, -14]],
   marks: [[0, 875, 'The piano'], ['summit', 2, 990, 'The summit'], ['summit', 72, 1024, 'The hush']],
   st: [ { at: 130, side: 'l', t: 939.5, name: 'The voice', notes: ['Clare Torry was a session singer, booked for a Sunday evening.', 'They told her there were no words.'] },
         { at: 290, side: 'r', t: 986, name: 'The climb', notes: ['She was paid thirty pounds and went home thinking they would not use it.', 'In 2005 her name was added to the writing credit.'] } ] },
 { no: 'VI', ts: 'l', name: 'Money', place: 'The gold cut', a0: 1151, a1: 1538,
   moves: [['F', 40, -5], ['A', 70, -60, -8], ['A', 70, 60, -6], ['F', 80, -4], ['A', 70, 40, -2], ['F', 50, 0]],
